career-profile:
  title: Career Profile
  summary: |
    Bilingual marketing specialist with experience in B2B marketing communications, content operations, product collateral, social media, and event marketing. I help companies turn complex product, brand, and event information into clear messaging, marketing materials, and organized execution plans.

    I hold an M.S. in Integrated Marketing from New York University and have hands-on experience building marketing infrastructure, launching owned media channels, coordinating cross-functional stakeholders, and supporting event and tradeshow execution across China and the U.S.

