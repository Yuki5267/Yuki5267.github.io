experiences:
  title: Professional Experience
  info:
  - role: Marketing Specialist
    time: Nov. 2024 - Jul. 2025
    company: ShareE Co., Ltd, Shanghai, China
    details: |
      Built and organized the company's marketing foundation across external messaging, product collateral, owned media, short-form video, event marketing, and internal documentation.

        - Built core marketing infrastructure from scratch and standardized external messaging for company-facing and public-facing materials.
        - Led the finalization of company overview materials and aligned multiple stakeholders across Product, Sales, Delivery/Consulting, design, and vendor teams.
        - Audited and restructured messaging for existing product lines; created and updated one-pagers, WeChat articles, and website product copy to improve consistency and sales enablement readiness.
        - Launched and operated the company WeChat Official Account end-to-end, including positioning, content pillars, publishing cadence, and content planning.
        - Published 50+ WeChat posts covering product updates, industry topics, and event communications.
        - Launched the company short-video channel from scratch; supported topic selection, scripting, filming, and editing for 10 short videos.
        - Planned and executed 5 tradeshow/expo participations, including event planning, collateral production, design/vendor coordination, onsite operations, and post-event promotion.
        - Built an internal knowledge base for brand, product, and event assets, improving material reuse and cross-team collaboration.

  - role: Communications Intern
    time: May 2021 - May 2022
    company: Shanghai Yicai Foundation, Shanghai, China
    details: |
      Supported multi-platform communication, content distribution, and offline event operations for foundation programs.

        - Managed content distribution across WeChat, Weibo, website, and Xiaohongshu.
        - Created platform-specific promotional posts to increase visibility and engagement for foundation programs.
        - Supported offline event planning and execution, including event preparation, media archives, and cross-department coordination.
        - Assisted with meeting coordination and process optimization to improve team communication efficiency.

  - role: Marketing Intern
    time: Sept. 2020 - Dec. 2020
    company: Abbott (Shanghai) Trading Co., Ltd, Shanghai, China
    details: |
      Supported market research, marketing strategy preparation, workflow tracking, and agency/vendor coordination.

        - Conducted market and competitor research and summarized consumer insights to support marketing strategy and advertising planning.
        - Tracked key steps of the BMP payment workflow and coordinated with Finance, Procurement, and vendors to support smooth execution.
        - Supported agency and partner relationship management for marketing-related projects.

